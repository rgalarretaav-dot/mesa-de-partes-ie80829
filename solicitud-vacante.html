    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* FONDO ANIMADO */
        body { 
            background: linear-gradient(135deg, #4f46e5, #06b6d4, #ec4899, #3b82f6);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 30px 20px; position: relative; overflow-x: hidden;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* BURBUJAS DE FONDO */
        .bubbles { position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: hidden; z-index: 1; pointer-events: none; }
        .bubble { position: absolute; bottom: -100px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; backdrop-filter: blur(5px); animation: floatUp linear infinite; }
        .bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 40px; height: 40px; left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 100px; height: 100px; left: 60%; animation-duration: 10s; animation-delay: 4s; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-1000px) scale(1.5); opacity: 0; } }

        /* TARJETA PRINCIPAL */
        .form-container { 
            position: relative; z-index: 10;
            width: 100%; max-width: 850px; 
            background: rgba(255, 255, 255, 0.95); border-radius: 24px; 
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4), 0 0 60px rgba(79, 70, 229, 0.3), inset 0 0 20px rgba(255,255,255,1); 
            padding: 40px 50px; 
            animation: cardEntrance 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 2px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        @keyframes cardEntrance { from { opacity: 0; transform: translateY(50px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* CABECERA */
        .header-form { margin-bottom: 25px; position: relative; }
        .header-form h2 { color: #1e3a8a; font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .header-form p { color: #64748b; font-size: 0.9rem; font-weight: 500; }
        .btn-volver { display: inline-block; margin-bottom: 20px; color: #64748b; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
        .btn-volver:hover { color: #3b82f6; transform: translateX(-5px); }

        /* AVISO PRESENCIAL */
        .aviso-presencial {
            background: #fffbeb; border: 2px solid #f59e0b; border-radius: 10px;
            padding: 15px; margin-bottom: 25px; text-align: center;
            animation: pulseBorder 2s infinite;
        }
        @keyframes pulseBorder {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .aviso-presencial p { color: #92400e; font-weight: 700; font-size: 1rem; margin-bottom: 5px; }
        .aviso-presencial span { color: #b45309; font-size: 0.9rem; font-weight: 500; }

        /* IMAGEN DEL FORMULARIO */
        .imagen-wrapper {
            position: relative;
            margin-bottom: 30px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 4px solid white;
            transition: transform 0.3s ease;
        }
        .imagen-wrapper:hover { transform: scale(1.02); }
        .imagen-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* BOTÓN DE DESCARGA */
        .btn-descarga {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6); 
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-descarga::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease; transform: skewX(-20deg);
        }
        .btn-descarga:hover::after { left: 150%; }
        .btn-descarga:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6); }

        @media (max-width: 650px) {
            .form-container { padding: 30px 20px; }
            .header-form h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bubbles"><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div></div>

    <div class="form-container">
        
        <div class="header-form">
            <a href="index.html" class="btn-volver">← Volver al inicio</a>

        <div class="aviso-presencial">
            <p>⚠️ TRÁMITE PRESENCIAL ⚠️</p>
            <span>Descargue el formulario, imprímalo, llénelo a mano y preséntelo en la Institución Educativa.</span>

        </a>

    </div>

    <!-- ========================================== -->
    <!-- CONTROL DE HORARIO DE ATENCIÓN (L-V 8am-4pm) -->
    <!-- ========================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lista de feriados en Perú (Formato YYYY-MM-DD)
            const feriados = [
                "2026-01-01", "2026-05-01", "2026-06-07", "2026-06-29", "2026-07-23", 
                "2026-07-28", "2026-07-29", "2026-08-06", "2026-08-30", "2026-10-08", 
                "2026-11-01", "2026-12-08", "2026-12-09", "2026-12-25",
                "2027-01-01", "2027-05-01", "2027-06-07", "2027-06-29", "2027-07-23", 
                "2027-07-28", "2027-07-29", "2027-08-06", "2027-08-30", "2027-10-08", 
                "2027-11-01", "2027-12-08", "2027-12-09", "2027-12-25"
            ];

            function verificarHorario() {
                const ahora = new Date();
                const diaSemana = ahora.getDay(); // 0 = Domingo, 1 = Lunes, ... 6 = Sábado
                const hora = ahora.getHours();
                const fechaString = ahora.toISOString().split('T')[0]; // Ej: "2026-10-20"

                let mensajeError = "";

                // 1. Verificar si es fin de semana
                if (diaSemana === 0 || diaSemana === 6) {
                    mensajeError = "Es fin de semana. Volvemos a atender el día Lunes a las 8:00 AM.";
                }
                // 2. Verificar si es feriado
                else if (feriados.includes(fechaString)) {
                    mensajeError = "Hoy es feriado nacional. Volvemos a atender el siguiente día hábil a las 8:00 AM.";
                }
                // 3. Verificar horario (8:00 AM a 4:00 PM)
                else if (hora < 8 || hora >= 16) {
                    mensajeError = "El horario de atención es de Lunes a Viernes, de 8:00 AM a 4:00 PM.";
                }

                // Si hay un mensaje de error, significa que está CERRADO
                if (mensajeError !== "") {
                    bloquearSistema(mensajeError);
                }
            }

            function bloquearSistema(mensaje) {
                // 1. Deshabilitar todos los inputs y botones
                document.querySelectorAll('form, button, input, textarea, select, a').forEach(el => {
                    if (!el.classList.contains('btn-volver') && !el.classList.contains('btn-admin-acceso')) {
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.4';
                    }
                });

                // 2. Crear el bloqueo visual
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
                    display: flex; flex-direction: column; justify-content: center; align-items: center;
                    z-index: 999999; font-family: 'Poppins', sans-serif; text-align: center; padding: 20px;
                    animation: fadeInOverlay 0.5s ease-out;
                `;
                
                overlay.innerHTML = `
                    <div style="background: white; padding: 50px 40px; border-radius: 24px; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 3px solid #ef4444;">
                        <div style="font-size: 5rem; margin-bottom: 20px; animation: floatIcon 3s ease-in-out infinite;">🔒</div>
                        <h2 style="color: #1e3a8a; font-size: 2rem; margin-bottom: 15px; text-transform: uppercase; font-weight: 800;">Atención Presencial Cerrada</h2>
                        <p style="color: #475569; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; font-weight: 500;">${mensaje}</p>
                        
                        <div style="background: #eff6ff; padding: 20px; border-radius: 12px; border-left: 5px solid #3b82f6; text-align: left;">
                            <p style="margin: 0; color: #1e40af; font-weight: 800; font-size: 0.95rem; text-transform: uppercase;">Horario Oficial:</p>
                            <p style="margin: 8px 0 0 0; color: #1e40af; font-size: 0.9rem; font-weight: 600;">📅 Lunes a Viernes</p>
                            <p style="margin: 2px 0 0 0; color: #1e40af; font-size: 0.9rem; font-weight: 600;">🕗 8:00 AM - 4:00 PM</p>
                        </div>
                        
                        <a href="index.html" style="display: inline-block; margin-top: 30px; background: #1e3a8a; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: 700; pointer-events: auto !important; opacity: 1 !important; transition: all 0.3s;" onmouseover="this.style.background='#3b82f6'" onmouseout="this.style.background='#1e3a8a'">
                            ← Volver a la Página Principal
                        </a>
                    </div>
                `;

                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
                    @keyframes popIn { 0% { transform: scale(0.8) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
                    @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
                `;
                document.head.appendChild(style);
                document.body.appendChild(overlay);
            }

            verificarHorario();
        });
    </script>
</body>
